            .report-page {

// ═══════════════════════════════════════════════════════════════════
//  HELPER FUNCTIONS
// ═══════════════════════════════════════════════════════════════════
function pct(score, max) { return Math.round((score / max) * 100); }

function miLevel(score) {
    const p = pct(score, MI_MAX);
    if (p >= 80) return { label: 'Dominant', color: '#27AE60', bg: '#E8F5E9' };
    if (p >= 60) return { label: 'Strong', color: '#2980B9', bg: '#E3F2FD' };
    if (p >= 40) return { label: 'Developing', color: '#F39C12', bg: '#FFF8E1' };
    return { label: 'Emerging', color: '#E74C3C', bg: '#FFEBEE' };
}

function lsLevel(score) {
    const p = pct(score, LS_MAX);
    if (p >= 80) return { label: 'Dominant', color: '#27AE60', bg: '#E8F5E9' };
    if (p >= 60) return { label: 'Strong', color: '#2980B9', bg: '#E3F2FD' };
    if (p >= 40) return { label: 'Moderate', color: '#F39C12', bg: '#FFF8E1' };
    return { label: 'Low', color: '#E74C3C', bg: '#FFEBEE' };
}

function getTopMI(miScores) {
    const indexed = miScores.map((s, i) => ({ key: MI_KEYS[i], score: s, index: i }));
    indexed.sort((a, b) => b.score - a.score);
    return indexed.slice(0, 3);
}

function getDominantLS(lsScores) {
    const indexed = lsScores.map((s, i) => ({ key: LS_KEYS[i], score: s }));
    indexed.sort((a, b) => b.score - a.score);
    const max = indexed[0].score;
    const min = indexed[indexed.length - 1].score;
    const isBalanced = (max - min) <= 1;
    return { sorted: indexed, isBalanced };
}

// ═══════════════════════════════════════════════════════════════════
//  SVG RADAR CHART
// ═══════════════════════════════════════════════════════════════════
function createRadarChart(scores) {
    const size = 340;
    const cx = size / 2, cy = size / 2;
    const R = 110;
    const n = 7;

    function pt(i, val) {
        const a = (2 * Math.PI / n) * i - Math.PI / 2;
        const r = (val / MI_MAX) * R;
        return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
    }

    let svg = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" style="font-family:'Segoe UI',sans-serif;">`;

    // Background circle fill
    svg += `<circle cx="${cx}" cy="${cy}" r="${R + 8}" fill="#FAFCFD"/>`;

    // Grid polygons (5 levels)
    for (let level = 1; level <= 5; level++) {
        const frac = level / 5;
        const pts = [];
        for (let i = 0; i < n; i++) {
            const p = pt(i, MI_MAX * frac);
            pts.push(`${p.x.toFixed(1)},${p.y.toFixed(1)}`);
        }
        svg += `<polygon points="${pts.join(' ')}" fill="${level === 5 ? 'none' : 'none'}" stroke="#E0E8EC" stroke-width="${level === 5 ? 1.2 : 0.6}" stroke-dasharray="${level < 5 ? '3,3' : 'none'}"/>`;
        // Level percentage label
        if (level < 5) {
            const lp = pt(0, MI_MAX * frac);
            svg += `<text x="${lp.x + 3}" y="${lp.y - 3}" font-size="7.5" fill="#B0BEC5">${level * 20}%</text>`;
        }
    }

    // Axis lines
    for (let i = 0; i < n; i++) {
        const p = pt(i, MI_MAX);
        svg += `<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="#D5DEE3" stroke-width="0.6"/>`;
    }

    // Data polygon  
    const dataPoints = scores.map((s, i) => pt(i, s));
    const poly = dataPoints.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    svg += `<polygon points="${poly}" fill="rgba(0,109,119,0.15)" stroke="#006D77" stroke-width="2.2" stroke-linejoin="round"/>`;

    // Data points + score labels
    dataPoints.forEach((p, i) => {
        const def = MI_DEF[MI_KEYS[i]];
        svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="${def.color}" stroke="white" stroke-width="2"/>`;
        // Score value near point
        const a = (2 * Math.PI / n) * i - Math.PI / 2;
        const lx = p.x + 10 * Math.cos(a);
        const ly = p.y + 10 * Math.sin(a);
        svg += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="700" fill="${def.color}">${scores[i]}</text>`;
    });

    // Labels
    for (let i = 0; i < n; i++) {
        const a = (2 * Math.PI / n) * i - Math.PI / 2;
        const lr = R + 32;
        const x = cx + lr * Math.cos(a);
        const y = cy + lr * Math.sin(a);
        const cosA = Math.cos(a);
        let anchor = 'middle';
        if (cosA > 0.25) anchor = 'start';
        else if (cosA < -0.25) anchor = 'end';
        const def = MI_DEF[MI_KEYS[i]];
        svg += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="10" font-weight="700" fill="${def.color}">${def.icon} ${def.short}</text>`;
    }

    svg += '</svg>';
    return svg;
}

// ═══════════════════════════════════════════════════════════════════
//  REPORT GENERATION
// ═══════════════════════════════════════════════════════════════════
function generateReport(st) {
    const top3 = getTopMI(st.mi);
    const lsResult = getDominantLS(st.ls);
    const uid = 'bars-' + st.sno;

    // ──── PAGE 1: Score Dashboard ────
    let html = `<div class="report-page" id="student-${st.sno}"><div class="report-inner">`;

    // Header
    html += `
    <div class="header-banner">
        <div class="logo-circle">SA</div>
        <div class="header-text">
            <h1>Multiple Intelligence &amp; Learning Style Profile</h1>
            <p>Srichakra Academy — The School To Identify Your Child's Divine Gift!</p>
            <span class="sub">(A Unit of SriKrpa Foundation Trust)</span>
        </div>
        <button class="download-btn no-print" onclick="downloadSingle(${st.sno})">⬇ Download PDF</button>
    </div>`;

    // Student bar
    html += `
    <div class="student-bar">
        <span class="name">👤 ${st.name}</span>
        <span>Grade: ${st.grade}</span>
        <span>Date: ${st.doa}</span>
    </div>`;

    // Chart section: radar + bars
    html += `<div class="chart-section">`;
    html += `<div class="radar-container">${createRadarChart(st.mi)}</div>`;
    html += `<div class="bars-container">`;

    // MI Bars
    st.mi.forEach((score, i) => {
        const def = MI_DEF[MI_KEYS[i]];
        const p = pct(score, MI_MAX);
        const lv = miLevel(score);
        html += `
        <div class="mi-bar-row">
            <div class="mi-bar-label" style="color:${def.color}">${def.icon} ${def.name}</div>
            <div class="mi-bar-track">
                <div class="mi-bar-fill" data-width="${p}%" style="background:linear-gradient(90deg, ${def.color}CC, ${def.color})">${p}%</div>
            </div>
            <div class="mi-bar-score">${score}/${MI_MAX}</div>
            <div class="mi-bar-level" style="color:${lv.color}">${lv.label}</div>
        </div>`;
    });

    html += `</div></div>`; // close bars-container & chart-section

    // Top 3 Strengths
    html += `<div class="section-title"><span class="icon">🏆</span> Top 3 Dominant Intelligences</div>`;
    html += `<div class="strengths-row">`;
    top3.forEach((item, rank) => {
        const def = MI_DEF[item.key];
        const p = pct(item.score, MI_MAX);
        html += `
        <div class="strength-card" style="background: linear-gradient(135deg, ${def.color}, ${def.color}DD);">
            <div class="rank">#${rank + 1}</div>
            <div class="s-icon">${def.icon}</div>
            <div class="s-name">${def.name}</div>
            <div class="s-score">${p}%</div>
            <div class="s-label">${def.aka}</div>
        </div>`;
    });
    html += `</div>`;

    // Learning Styles
    html += `<div class="section-title"><span class="icon">📚</span> Learning Style Profile</div>`;
    html += `<div class="ls-section">`;
    st.ls.forEach((score, i) => {
        const def = LS_DEF[LS_KEYS[i]];
        const p = pct(score, LS_MAX);
        const lv = lsLevel(score);
        html += `
        <div class="ls-bar-row">
            <div class="ls-icon">${def.icon}</div>
            <div class="ls-info">
                <div class="ls-name">${def.name}</div>
                <div class="ls-score-text">${score}/${LS_MAX}</div>
            </div>
            <div class="ls-track">
                <div class="ls-fill" data-width="${p}%" style="background: linear-gradient(90deg, ${def.color}CC, ${def.color})">${p}%</div>
            </div>
            <div class="ls-level-badge" style="color:${lv.color}; background:${lv.bg}">${lv.label}</div>
        </div>`;
    });

    // Learning style insight
    if (lsResult.isBalanced) {
        html += `<div class="ls-insight">🌟 <strong>Balanced Learner!</strong> ${st.name} adapts well across Visual, Auditory, and Kinesthetic modes. Use a mix of learning methods for best results.</div>`;
    } else {
        const dom = lsResult.sorted[0];
        const domDef = LS_DEF[dom.key];
        html += `<div class="ls-insight">🌟 <strong>Primarily a ${domDef.name} Learner</strong> — ${domDef.desc}</div>`;
    }

    html += `</div>`; // close ls-section

    // Footer page 1
    html += `
    <div class="report-footer">
        <strong>Srichakra Academy</strong> — Comprehensive Psychometric Profile &nbsp;|&nbsp; Page 1 of 2
    </div>`;
    html += `</div></div>`; // close report-inner & report-page

    // ──── PAGE 2: Guidance & Tips ────
    html += `<div class="report-page guidance-page"><div class="report-inner">`;

    html += `
    <div class="guidance-banner">
        <div class="logo-circle">SA</div>
        <div>
            <h2>Understanding ${st.name}'s Unique Strengths</h2>
            <span class="sub">Personalised guidance for parents and teachers</span>
        </div>
    </div>`;

    // Student bar (mini)
    html += `
    <div class="student-bar">
        <span class="name">👤 ${st.name} — Grade ${st.grade}</span>
        <span>Assessment: ${st.doa}</span>
    </div>`;

    // Intelligence detail cards for top 3
    html += `<div class="section-title"><span class="icon">🧠</span> Your Child's Top Intelligence Areas</div>`;
    html += `<div class="intel-details">`;
    top3.forEach((item, rank) => {
        const def = MI_DEF[item.key];
        const p = pct(item.score, MI_MAX);
        html += `
        <div class="intel-card" style="border-color:${def.color}; background: ${def.color}08;">
            <div class="ic-icon">${def.icon}</div>
            <div>
                <div class="ic-name">${def.name} Intelligence <span style="color:${def.color}; font-size:0.85em;">(${p}%)</span></div>
                <div class="ic-aka">${def.aka}</div>
                <div class="ic-desc">${def.desc}</div>
            </div>
        </div>`;
    });
    html += `</div>`;

    // Tips grid: Parent Tips + School Tips + Learning Tips + General
    html += `<div class="section-title"><span class="icon">💡</span> Actionable Recommendations</div>`;
    html += `<div class="tips-grid">`;

    // Parent tips (from top intelligences)
    const parentTips = top3.flatMap(item => {
        const def = MI_DEF[item.key];
        return def.parentTips.slice(0, 1).map(t => `${def.icon} ${t}`);
    });
    html += `
    <div class="tip-box parent-tips">
        <h3>🏠 Tips for Parents</h3>
        <ul>${parentTips.map(t => `<li>${t}</li>`).join('')}</ul>
    </div>`;

    // School tips
    const schoolTips = top3.flatMap(item => {
        const def = MI_DEF[item.key];
        return def.schoolTips.slice(0, 1).map(t => `${def.icon} ${t}`);
    });
    html += `
    <div class="tip-box school-tips">
        <h3>🏫 Tips for School</h3>
        <ul>${schoolTips.map(t => `<li>${t}</li>`).join('')}</ul>
    </div>`;

    // Learning style tips
    const domLS = lsResult.sorted[0];
    const domLSDef = LS_DEF[domLS.key];
    html += `
    <div class="tip-box ls-tips">
        <h3>${domLSDef.icon} Learning Style Tips</h3>
        <ul>${domLSDef.tips.slice(0, 3).map(t => `<li>${t}</li>`).join('')}</ul>
    </div>`;

    // General tips
    html += `
    <div class="tip-box general-tips">
        <h3>✨ General Guidance</h3>
        <ul>
            <li>Every intelligence can be nurtured with the right environment</li>
            <li>Focus on strengths while gently developing other areas</li>
            <li>Avoid comparing — each child has a unique intelligence profile</li>
        </ul>
    </div>`;

    html += `</div>`; // close tips-grid

    // Footer page 2
    html += `
    <div class="report-footer">
        <strong>Srichakra Academy</strong> — (A Unit of SriKrpa Foundation Trust)<br>
        Based on Howard Gardner's Theory of Multiple Intelligences &nbsp;|&nbsp; This report is a guidance tool, not a definitive assessment. &nbsp;|&nbsp; Page 2 of 2
    </div>`;

    html += `</div></div>`; // close report-inner & report-page (page 2)

    return html;
}

//  INITIALIZE
// ═══════════════════════════════════════════════════════════════════
const container = document.getElementById('reports');
container.innerHTML = students.map(s => generateReport(s)).join('');

// Download single student report
function downloadSingle(sno) {
    // Hide all other students' pages
    document.querySelectorAll('.report-page').forEach(el => {
        if (!el.id.includes('student-' + sno) && !el.dataset.student) {
            el.classList.add('hide-for-print');
        }
    });
    // Tag guidance pages by student number
    // Each student has 2 divs: report-page#student-N and the next report-page.guidance-page
    const allPages = document.querySelectorAll('.report-page');
    let found = false;
    allPages.forEach(el => {
        const isMain = el.id === 'student-' + sno;
        if (isMain) { found = true; el.classList.remove('hide-for-print'); return; }
        if (found && el.classList.contains('guidance-page')) {
            el.classList.remove('hide-for-print');
            found = false; return;
        }
        found = false;
        el.classList.add('hide-for-print');
    });

    window.print();

    // Restore all pages after print dialog
    setTimeout(() => {
        document.querySelectorAll('.report-page').forEach(el => {
            el.classList.remove('hide-for-print');
        });
    }, 500);
}

// Animate bars on load
setTimeout(() => {
    document.querySelectorAll('.mi-bar-fill, .ls-fill').forEach(bar => {
        bar.style.width = bar.dataset.width;
    });
}, 150);
</script>
